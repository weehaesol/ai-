<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몽글 왁뿌 공방</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',system-ui,sans-serif;color:#735e79;background:radial-gradient(circle at 5% 5%,#fff2c8,transparent 35%),radial-gradient(circle at 95% 5%,#f8d5ed,transparent 40%),#f1edff;min-height:100vh}header{text-align:center;padding:22px 10px 5px}h1{margin:0;color:#a781ba;font-size:clamp(26px,5vw,40px)}header p{margin:7px;color:#a58fae}.layout{max-width:1050px;margin:auto;padding:15px;display:grid;grid-template-columns:320px 1fr;gap:17px}.panel{background:#ffffffd9;border:3px solid #fff;border-radius:27px;padding:20px;box-shadow:0 10px 30px #9478a326}h2{font-size:19px;margin:5px 0 15px}.section{margin:16px 0}.section strong{display:block;font-size:14px;margin-bottom:9px}.options{display:flex;gap:7px;flex-wrap:wrap}.choice,.action{border:0;cursor:pointer;font:inherit;border-radius:14px;padding:10px 12px;background:#f5ecff;color:#80688c;font-weight:bold}.choice.active{outline:2px solid #c7a5eb;background:#eadbff}.swatch{height:39px;width:39px;border-radius:50%;border:3px solid white;box-shadow:0 2px 7px #bca9c5;cursor:pointer}.swatch.active{outline:3px solid #b79add}input[type=range]{width:100%;accent-color:#c49bdc}.action{background:#ffe5b9;color:#886b61}.action.main{background:linear-gradient(110deg,#cbb0f9,#f6aecf);color:white;width:100%;font-size:16px;padding:14px}.action:disabled{opacity:.45;cursor:not-allowed}.stage{min-height:570px;text-align:center;background:radial-gradient(circle at 50% 35%,#fff,#fff8fb 60%,#eee5ff);display:flex;flex-direction:column;align-items:center;justify-content:center}.tag{font-size:12px;background:#fff0fa;border-radius:30px;padding:8px 15px;color:#aa81b3;font-weight:bold}.scene{position:relative;width:100%;height:345px;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}.shadow{position:absolute;bottom:26px;width:210px;height:25px;border-radius:50%;background:#9b7e9850;filter:blur(13px)}.ball{--core:#ffc4d6;--wax:#cbb8f6;width:230px;height:230px;border-radius:50%;position:relative;cursor:pointer;touch-action:none;user-select:none;background:radial-gradient(circle at 32% 23%,#fff9,transparent 28%),var(--core);box-shadow:inset -16px -19px 24px #78658035,inset 13px 12px 23px #fff9,0 13px 20px #b09bb255;transition:transform .13s,background .3s}.ball .coat{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 20%,#fff9,transparent 30%),var(--wax);box-shadow:inset -17px -21px 25px #6d5b7933,inset 11px 12px 17px #fff8;opacity:0;transition:opacity .3s} .ball .coat{overflow:hidden}.ball .coat:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 26% 22%,#fff9,transparent 35%),repeating-radial-gradient(ellipse at 65% 70%,#fff2 0 2px,#0000 3px 12px);pointer-events:none}.ball .face{position:absolute;inset:45% 0 auto;font-size:29px;pointer-events:none}.ball svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3} .ball .wax-chip{position:absolute;z-index:4;pointer-events:none;border:1px solid #fff9;border-radius:26% 47% 33% 22%;background:linear-gradient(135deg,#fff9,var(--wax) 34%,#79617b55);box-shadow:inset -3px -3px 5px #58405c33,2px 4px 6px #55405a38;animation:chipFly .9s cubic-bezier(.16,.65,.38,1) forwards}.ball.impact{animation:impact .22s cubic-bezier(.2,.8,.2,1)}@keyframes impact{0%{transform:scale(1)}35%{transform:scale(1.13,.79) rotate(-2deg)}72%{transform:scale(.94,1.09) rotate(1deg)}100%{transform:scale(1)}}@keyframes chipFly{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}45%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.5)}}.ball path{stroke:#80617e;stroke-width:3.2;fill:none;stroke-linecap:round;filter:drop-shadow(1px 1px 1px #fff) drop-shadow(-1px -1px 1px #4d375d)}.ball.squish{animation:squish .24s}.ball.dip{animation:dip .45s}@keyframes squish{50%{transform:scale(1.12,.86)}}@keyframes dip{50%{transform:translateY(54px) scale(.96)}}.bowl{position:absolute;bottom:6px;width:285px;height:85px;border-radius:20% 20% 50% 50%;background:linear-gradient(#e8c1fa,#c99de2);box-shadow:inset 0 12px #fff8,0 7px 10px #a88bab55;z-index:0}.bowl:after{content:'';position:absolute;top:8px;left:8px;right:8px;height:18px;border-radius:50%;background:#f8e7ff}.ball{z-index:1}.particle{position:absolute;width:17px;height:14px;clip-path:polygon(10% 0,100% 20%,80% 100%,0 70%);background:var(--wax);border:1px solid #fff;pointer-events:none;z-index:3;animation:scatter .8s forwards}@keyframes scatter{to{transform:translate(var(--x),var(--y)) rotate(170deg);opacity:0}}.status{font-size:17px;font-weight:bold;min-height:51px;max-width:450px}.bar{width:min(330px,90%);height:12px;background:#e9e0f2;border-radius:20px;overflow:hidden;margin:8px}.fill{height:100%;width:0;background:linear-gradient(90deg,#f5aecd,#b9a8f4);transition:width .2s}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:12px}.hint{font-size:12px;color:#ab96af;line-height:1.6}.hidden{display:none}.recipe{padding:12px;border-radius:15px;background:#faf2ff;font-size:13px;line-height:1.7}.emoji{position:absolute;top:24px;right:25px;font-size:27px}@media(max-width:750px){.layout{grid-template-columns:1fr}.scene{height:315px}.stage{min-height:515px}}
</style></head><body><header><h1>☁️ 몽글 왁뿌 공방 🫧</h1><p>직접 빚고 · 왁스에 담그고 · 굳힌 다음 · 바사삭 깨기 ♡</p></header><main class="layout"><section class="panel"><h2>🎀 나만의 레시피</h2><div class="section"><strong>① 말랑한 속재료</strong><div class="options" id="cores"><button class="choice active" data-v="클레이">☁️ 클레이</button><button class="choice" data-v="스퀴시">🍮 스퀴시</button><button class="choice" data-v="젤리">🫧 젤리</button></div></div><div class="section"><strong>② 속재료 색상</strong><div class="options" id="colors"></div></div><div class="section"><strong>③ 왁스 색상</strong><div class="options" id="waxes"></div></div><div class="section"><strong>④ 왁스 두께 <span id="thickLabel">3겹</span></strong><input type="range" min="1" max="5" value="3" id="thick"></div><div class="recipe" id="recipe">🧁 재료 준비 완료!<br>실제 공방처럼 각 단계를 직접 진행해 봐.</div><div class="section"><button class="action main" id="start">🍓 만들기 시작</button></div><div class="hint">* 실제 왁스는 뜨거울 수 있어요. 이 게임은 안전한 가상 공방이에요.</div></section><section class="panel stage"><div class="emoji">✧</div><div class="tag" id="phase">STEP 1 · 재료 준비</div><div class="scene" id="scene"><div class="shadow"></div><div class="bowl hidden" id="bowl"></div><div class="ball" id="ball" role="button" tabindex="0" aria-label="공 만지기"><div class="coat" id="coat"></div><div class="face" id="face">˶ᵔ ᵕ ᵔ˶</div><svg id="cracks" viewBox="0 0 230 230"></svg></div></div><div class="status" id="status">재료를 고르고 만들기 시작을 눌러 줘! 💕</div><div class="bar"><div class="fill" id="fill"></div></div><div class="controls"><button class="action" id="next" disabled>다음 단계</button><button class="action" id="reset">🔄 처음부터</button><button class="action" id="sound">🔊 소리 ON</button><button class="action" id="preview">🎧 선택 재료 소리 듣기</button></div><div class="hint" id="hint">만들기 → 손으로 빚기 → 왁스 담그기 → 식히기 → 부수기</div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const palette=[['딸기','#ffc3d8'],['라벤더','#cdbaf5'],['민트','#b7e9d9'],['레몬','#ffe8a9'],['하늘','#b8ddf9'],['복숭아','#ffd0b9']];let core='#ffc3d8',wax='#cdbaf5',material='클레이',stage='ready',kneads=0,dips=0,hits=0,need=3,maxHits=14,soundOn=true,ctx=null,token=0;function audioReady(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}function crackSound(big=false){
 if(!soundOn)return;audioReady();if(!ctx)return;
 const t=ctx.currentTime,rate=ctx.sampleRate;
 const out=ctx.createGain();out.gain.value=.64;out.connect(ctx.destination);
 function grain(at,len,vol,low,high,texture='crisp'){
  const n=Math.ceil(rate*len),buffer=ctx.createBuffer(1,n,rate),data=buffer.getChannelData(0);let sm=0;
  for(let i=0;i<n;i++){const x=i/n,r=Math.random()*2-1;sm=.94*sm+.06*r;
   const envelope=texture==='crisp'?Math.pow(1-x,5)*(1-Math.exp(-x*180)):texture==='rub'?Math.sin(Math.PI*x)**2:Math.pow(1-x,1.35)*(1-Math.exp(-x*24));
   data[i]=(texture==='rub'?sm*3: texture==='crumb'?(.6*r+.4*sm):r)*envelope;
  }
  const src=ctx.createBufferSource();src.buffer=buffer;
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=low;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=high;
  const g=ctx.createGain();g.gain.value=vol;
  src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(out);src.start(t+at);
 }
 function chirp(at,len,start,end,vol,type='sine'){
  const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;
  o.frequency.setValueAtTime(start,t+at);o.frequency.exponentialRampToValueAtTime(end,t+at+len);
  g.gain.setValueAtTime(.0001,t+at);g.gain.exponentialRampToValueAtTime(vol,t+at+.009);
  g.gain.exponentialRampToValueAtTime(.0001,t+at+len);
  o.connect(g);g.connect(out);o.start(t+at);o.stop(t+at+len+.01);
 }
 // Each ball starts with a thin wax-shell snap, never a low-frequency impact.
 grain(0,.016,.22,3300,12000);
 if(material==='클레이'){
  // Short, dry, granular crumble: many separated sandy flakes.
  for(let i=0;i<(big?24:13);i++){
   const d=.014+i*(big?.011:.009)+Math.random()*.008;
   grain(d,.014+Math.random()*.018,.12,1700+Math.random()*900,6700,'crisp');
  }
  for(let i=0;i<(big?10:5);i++)grain(.055+i*.022,.034,.07,850,3200,'crumb');
 }else if(material==='스퀴시'){
  // Single shell snap followed by long airy foam compression/rebound.
  for(let i=0;i<(big?7:4);i++)grain(.015+i*.019,.012,.09,2700,9000);
  grain(.065,big?.43:.33,.32,180,1900,'rub');
  grain(.16,big?.33:.22,.20,380,2500,'rub');
  chirp(.075,.23,350,165,.048);
  chirp(.22,.16,180,290,.025);
 }else{
  // Bright brittle crackles, then elastic wet pops and a wobbly jelly tail.
  for(let i=0;i<(big?14:8);i++)grain(.014+i*.013,.009,.095,3400,10500);
  const bubbles=big?9:5;
  for(let i=0;i<bubbles;i++){
   const d=.055+i*.045+Math.random()*.012;
   chirp(d,.055+Math.random()*.045,740+Math.random()*430,190+Math.random()*100,.045);
   grain(d,.035,.075,520,3000,'rub');
  }
  chirp(.09,big?.40:.28,270,125,.048);
  chirp(.18,big?.32:.23,160,280,.03);
 }
}
function softSound(){if(!soundOn)return;audioReady();if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(105,t+.13);g.gain.setValueAtTime(.075,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.15)}function say(s){$('status').textContent=s}function progress(p){$('fill').style.width=Math.min(100,p)+'%'}function setStage(s,label){stage=s;$('phase').textContent=label}function select(id,fn){$(id).addEventListener('click',e=>{let b=e.target.closest('button');if(!b||stage!=='ready')return;$(id).querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');fn(b.dataset.v);render()})}select('cores',v=>material=v);for(let [id,initial,fn] of [['colors',core,v=>core=v],['waxes',wax,v=>wax=v]]){palette.forEach(([name,c])=>{let b=document.createElement('button');b.className='swatch'+(c===initial?' active':'');b.dataset.v=c;b.title=name;b.setAttribute('aria-label',name);b.style.background=c;$(id).append(b)});select(id,fn)}$('thick').addEventListener('input',()=>{$('thickLabel').textContent=$('thick').value+'겹'});function render(){$('ball').style.setProperty('--core',core);$('ball').style.setProperty('--wax',wax);$('scene').style.setProperty('--wax',wax);$('coat').style.opacity=stage==='ready'||stage==='knead'?0:stage==='dip'?dips/need*.95:stage==='break'?Math.max(.08,1-Math.pow(hits/maxHits,1.5)*.94):stage==='broken'?0:1;$('face').textContent=stage==='broken'?'•ᴗ•':'˶ᵔ ᵕ ᵔ˶'}function animate(cls){let b=$('ball');b.classList.remove('squish','dip','impact');void b.offsetWidth;b.classList.add(cls)}function scatter(n){for(let i=0;i<n;i++){let p=document.createElement('i');p.className='particle';p.style.left=(42+Math.random()*16)+'%';p.style.top=(30+Math.random()*30)+'%';p.style.setProperty('--x',(Math.random()*290-145)+'px');p.style.setProperty('--y',(Math.random()*220-110)+'px');$('scene').append(p);setTimeout(()=>p.remove(),850)}}function start(){token++;kneads=dips=hits=0;need=Number($('thick').value);maxHits=7+need*3;$('cracks').innerHTML='';$('ball').querySelectorAll('.wax-chip').forEach(x=>x.remove());$('bowl').classList.add('hidden');setStage('knead','STEP 2 · 손으로 동글동글 빚기');$('start').disabled=true;$('next').disabled=true;progress(0);say('공을 6번 눌러 속재료를 동그랗게 빚어 줘! ✋');$('hint').textContent='볼을 직접 클릭하거나 터치해 반죽해 봐';render();softSound()}function next(){if(stage==='knead'&&kneads>=6){setStage('dip','STEP 3 · 녹인 왁스에 담그기');$('bowl').classList.remove('hidden');dips=0;progress(0);$('next').disabled=true;say('볼을 눌러 왁스에 퐁당! '+need+'번 코팅해 줘 🫧');$('hint').textContent='매번 왁스에 담가 한 겹씩 입혀 줘';render()}else if(stage==='dip'&&dips>=need){setStage('cool','STEP 4 · 코팅 굳히기');$('bowl').classList.add('hidden');$('next').disabled=false;progress(0);say('❄️ 식히기 버튼을 눌러 왁스를 굳혀 줘!');$('next').textContent='❄️ 식히기';render()}else if(stage==='cool'){setStage('cooling','❄️ 왁스 굳히는 중');$('next').disabled=true;let current=++token;let p=0;const timer=setInterval(()=>{if(token!==current){clearInterval(timer);return}p+=10;progress(p);if(p>=100){clearInterval(timer);setStage('break','STEP 5 · 바사삭 부수기');$('next').textContent='다음 단계';say('완성! 이제 볼을 눌러 왁스 껍질을 바사삭 깨 봐! 💥');$('hint').textContent='🔊 소리를 켜고 볼을 눌러 봐. 속재료마다 다른 바사삭 소리가 나요!';render()}},150)}}function touchBall(){if(stage==='knead'){kneads++;animate('squish');softSound();progress(kneads/6*100);say(kneads<6?'조물조물~ '+kneads+'/6번 빚었어 ☁️':'동그랗게 완성! 아래 다음 단계 버튼을 눌러 줘 🎀');if(kneads>=6){kneads=6;$('next').disabled=false}return}if(stage==='dip'){if(dips>=need)return;dips++;animate('dip');softSound();progress(dips/need*100);say(dips<need?'퐁당! '+dips+'/'+need+'겹 코팅했어 🫧':'반짝반짝 코팅 완성! 다음 단계로 넘어가자 ✨');if(dips>=need)$('next').disabled=false;render();return}if(stage!=='break')return;
 hits=Math.min(maxHits,hits+1);animate('impact');crackSound(hits>=maxHits);
 const svg=$('cracks'),ns='http://www.w3.org/2000/svg';
 // Cracks branch from the contact point and follow jagged paths across the wax shell.
 const angle=hits*2.39996,rad=12+Math.sqrt(hits/maxHits)*63;
 const sx=115+Math.cos(angle)*rad,sy=115+Math.sin(angle)*rad;
 for(let branch=0;branch<(hits%3===0?3:2);branch++){
  let a=angle+branch*1.9, x=sx,y=sy,points=`M ${x.toFixed(1)} ${y.toFixed(1)}`;
  for(let k=0;k<5;k++){a+=(Math.random()-.5)*1.1;x+=Math.cos(a)*(9+Math.random()*8);y+=Math.sin(a)*(9+Math.random()*8);points+=` L ${x.toFixed(1)} ${y.toFixed(1)}`}
  let path=document.createElementNS(ns,'path');path.setAttribute('d',points);path.setAttribute('opacity',String(Math.max(.45,1-hits/maxHits*.25)));svg.append(path);
 }
 // Physical chips fall off the shell and reveal the colored filling.
 const pieces=2+Math.floor(hits/3)+(hits===maxHits?13:0);
 for(let i=0;i<pieces;i++){
  const chip=document.createElement('i');chip.className='wax-chip';
  const a=angle+(Math.random()-.5)*2.6,r=30+Math.random()*63;
  const x=115+Math.cos(a)*r,y=115+Math.sin(a)*r;
  chip.style.left=(x-8)+'px';chip.style.top=(y-7)+'px';
  const size=8+Math.random()*16;chip.style.width=size+'px';chip.style.height=(size*.75)+'px';
  chip.style.setProperty('--dx',(Math.cos(a)*(65+Math.random()*120))+'px');
  chip.style.setProperty('--dy',(55+Math.random()*125)+'px');
  chip.style.setProperty('--rot',(Math.random()*520-260)+'deg');
  $('ball').append(chip);setTimeout(()=>chip.remove(),950);
 }
 if(hits%2===0)scatter(3+Math.floor(hits/4));
 progress(hits/maxHits*100);
 const lines=material==='클레이'?['딱! 껍질에 금이 갔어','사각사각, 얇은 왁스 조각이 부서져!','파사삭! 속의 클레이가 보여']:material==='스퀴시'?['빠직! 껍질이 갈라져','폭신! 안쪽 스퀴시가 눌렸다 돌아와','바삭, 말랑! 조각이 떨어져']:['톡! 얇은 왁스가 깨져','빠지직! 젤리가 탱글하게 흔들려','바사삭! 젤리가 드러나'];
 say(lines[(hits-1)%lines.length]+' ('+hits+'/'+maxHits+')');render();
 if(hits>=maxHits){setStage('broken','🎉 완파 성공!');$('cracks').innerHTML='';scatter(30);say('와아! 왁스 껍질이 모두 깨지고 '+material+' 속재료가 드러났어! 💕');$('hint').textContent='처음부터 버튼으로 다른 색의 왁뿌볼도 만들어 봐';render()}}
 function reset(){token++;setStage('ready','STEP 1 · 재료 준비');kneads=dips=hits=0;$('cracks').innerHTML='';$('ball').querySelectorAll('.wax-chip').forEach(x=>x.remove());$('bowl').classList.add('hidden');$('start').disabled=false;$('next').disabled=true;$('next').textContent='다음 단계';progress(0);say('새로운 왁뿌볼을 만들어 볼까? 💗');$('hint').textContent='만들기 → 손으로 빚기 → 왁스 담그기 → 식히기 → 부수기';render()}$('start').addEventListener('click',start);$('next').addEventListener('click',next);$('reset').addEventListener('click',reset);$('sound').addEventListener('click',()=>{audioReady();soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 소리 ON':'🔇 소리 OFF'});$('preview').addEventListener('click',()=>{audioReady();if(!soundOn){soundOn=true;$('sound').textContent='🔊 소리 ON'}crackSound(false)});$('ball').addEventListener('pointerdown',touchBall);$('ball').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();touchBall()}});render()})();
</script></body></html>
