
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>몽글 왁뿌 공방</title>
<style>
:root {
  --ink:#735e79;
  --purple:#cbb0f9;
  --pink:#f6aecf;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:"Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 5% 5%,#fff2c8,transparent 35%),
    radial-gradient(circle at 95% 5%,#f8d5ed,transparent 40%),
    #f1edff;
  min-height:100vh;
}
header {text-align:center;padding:24px 12px 8px}
h1 {font-size:clamp(27px,5vw,42px);color:#a781ba;margin:0}
header p {color:#a58fae}
.layout {
  max-width:1050px;margin:auto;padding:15px;
  display:grid;grid-template-columns:320px 1fr;gap:18px;
}
.panel {
  background:#ffffffdf;border:3px solid white;
  border-radius:27px;padding:20px;
  box-shadow:0 10px 30px #9478a326;
}
h2 {font-size:20px;margin:5px 0 18px}
.section {margin:18px 0}
.section strong {display:block;margin-bottom:10px;font-size:14px}
.options {display:flex;flex-wrap:wrap;gap:8px}
button {
  font:inherit;cursor:pointer;border:0;
  border-radius:14px;padding:11px 13px;
  background:#f5ecff;color:#80688c;font-weight:bold;
}
button:hover:not(:disabled) {filter:brightness(.97)}
button:active:not(:disabled) {transform:scale(.97)}
button:disabled {opacity:.45;cursor:not-allowed}
button:focus-visible {outline:3px solid #9b75d4;outline-offset:3px}
.choice.active {outline:2px solid #c7a5eb;background:#eadbff}
.swatch {
  width:39px;height:39px;border:3px solid white;
  border-radius:50%;box-shadow:0 2px 7px #bca9c5;
}
.swatch.active {outline:3px solid #b79add}
input[type=range] {width:100%;accent-color:#c49bdc}
.main {
  width:100%;padding:15px;color:white;
  background:linear-gradient(110deg,#cbb0f9,#f6aecf);
}
.recipe {
  background:#faf2ff;border-radius:15px;
  padding:13px;font-size:13px;line-height:1.7;
}
.stage {
  min-height:570px;text-align:center;
  background:radial-gradient(circle at 50% 35%,#fff,#fff8fb 60%,#eee5ff);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.tag {
  background:#fff0fa;border-radius:30px;
  padding:9px 16px;font-size:12px;
  font-weight:bold;color:#aa81b3;
}
.scene {
  position:relative;width:100%;height:345px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:manipulation;
}
.shadow {
  position:absolute;bottom:27px;width:205px;height:24px;
  border-radius:50%;background:#9b7e9850;filter:blur(13px);
}
.bowl {
  position:absolute;bottom:5px;width:285px;height:85px;
  border-radius:20% 20% 50% 50%;
  background:linear-gradient(#e8c1fa,#c99de2);
  box-shadow:inset 0 12px #fff8,0 7px 10px #a88bab55;
}
.bowl:after {
  content:"";position:absolute;top:8px;left:8px;right:8px;
  height:18px;border-radius:50%;background:#f8e7ff;
}
.ball {
  --core:#ffc3d8;--wax:#cdbaf5;
  position:relative;z-index:2;
  width:230px;height:230px;border-radius:50%;
  cursor:pointer;touch-action:manipulation;user-select:none;
  background:
    radial-gradient(circle at 32% 23%,#fff9,transparent 28%),
    var(--core);
  box-shadow:
    inset -16px -19px 24px #78658035,
    inset 13px 12px 23px #fff9,
    0 13px 20px #b09bb255;
  transition:transform .12s;
}
.coat {
  position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 28% 20%,#fff9,transparent 30%),
    var(--wax);
  box-shadow:
    inset -17px -21px 25px #6d5b7933,
    inset 11px 12px 17px #fff8;
  transition:opacity .18s;
}
.face {
  position:absolute;top:44%;width:100%;
  font-size:28px;pointer-events:none;
}
#cracks {
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;
}
#cracks path {
  fill:none;stroke:#75546e;stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(1px 1px 0 #fff9);
}
#holes {
  position:absolute;inset:0;border-radius:50%;
  pointer-events:none;
}
.hole {
  position:absolute;border-radius:48% 52% 43% 57%;
  background:var(--core);
  box-shadow:inset 3px 3px 8px #66516b44,0 0 0 2px #ffffff55;
  transform:translate(-50%,-50%) scale(0);
  animation:holeOpen .3s forwards;
}
@keyframes holeOpen {
  to {transform:translate(-50%,-50%) scale(1)}
}
.ball.press {animation:press .23s ease-out}
.ball.dip {animation:dip .48s ease-in-out}
@keyframes press {
  40% {transform:scale(1.11,.86) rotate(-2deg)}
  75% {transform:scale(.96,1.04)}
}
@keyframes dip {
  50% {transform:translateY(54px) scale(.96)}
}
.particle {
  position:absolute;z-index:5;pointer-events:none;
  background:var(--wax);
  clip-path:polygon(8% 0,100% 17%,76% 100%,0 72%);
  border:1px solid #fff9;
  box-shadow:0 2px 5px #7c608744;
  animation:scatter .85s ease-out forwards;
}
@keyframes scatter {
  to {
    transform:translate(var(--x),var(--y)) rotate(var(--r));
    opacity:0;
  }
}
.status {
  font-size:17px;font-weight:bold;min-height:55px;
  max-width:460px;line-height:1.5;
}
.bar {
  width:min(330px,90%);height:12px;
  background:#e9e0f2;border-radius:20px;
  overflow:hidden;margin:8px;
}
.fill {
  height:100%;width:0;
  background:linear-gradient(90deg,#f5aecd,#b9a8f4);
  transition:width .2s;
}
.controls {
  display:flex;justify-content:center;
  flex-wrap:wrap;gap:9px;margin:14px;
}
.hint {font-size:12px;color:#ab96af;line-height:1.7}
.hidden {display:none!important}
@media(max-width:750px) {
  .layout {grid-template-columns:1fr}
  .scene {height:315px}
  .stage {min-height:515px}
}
</style>
</head>
<body>

<header>
  <h1>☁️ 몽글 왁뿌 공방 🫧</h1>
  <p>직접 빚고 · 왁스에 담그고 · 굳힌 다음 · 바사삭 깨기 ♡</p>
</header>

<main class="layout">
  <section class="panel">
    <h2>🎀 나만의 레시피</h2>

    <div class="section">
      <strong>① 말랑한 속재료</strong>
      <div class="options" id="cores">
        <button class="choice active" data-v="클레이">☁️ 클레이</button>
        <button class="choice" data-v="스퀴시">🍮 스퀴시</button>
        <button class="choice" data-v="젤리">🫧 젤리</button>
      </div>
    </div>

    <div class="section">
      <strong>② 속재료 색상</strong>
      <div class="options" id="colors"></div>
    </div>

    <div class="section">
      <strong>③ 왁스 색상</strong>
      <div class="options" id="waxes"></div>
    </div>

    <div class="section">
      <strong>④ 왁스 두께 <span id="thickLabel">3겹</span></strong>
      <input type="range" min="1" max="5" value="3" id="thick">
    </div>

    <div class="recipe" id="recipe">
      🧁 재료 준비 완료!
      <br>속재료를 만들고 왁스를 코팅한 뒤 직접 깨뜨려 봐.
    </div>

    <div class="section">
      <button class="main" id="start">🍓 만들기 시작</button>
    </div>

    <p class="hint">
      실제 왁스는 뜨거울 수 있어요.
      이곳은 안전한 가상 공방입니다.
    </p>
  </section>

  <section class="panel stage">
    <div class="tag" id="phase">STEP 1 · 재료 준비</div>

    <div class="scene" id="scene">
      <div class="shadow"></div>
      <div class="bowl hidden" id="bowl"></div>

      <div class="ball" id="ball"
           role="button" tabindex="0"
           aria-label="왁뿌볼 누르기">
        <div class="coat" id="coat"></div>
        <div id="holes"></div>
        <div class="face" id="face">˶ᵔ ᵕ ᵔ˶</div>
        <svg id="cracks" viewBox="0 0 230 230"></svg>
      </div>
    </div>

    <div class="status" id="status">
      재료를 고르고 만들기 시작을 눌러 줘! 💕
    </div>

    <div class="bar"><div class="fill" id="fill"></div></div>

    <div class="controls">
      <button id="next" disabled>다음 단계</button>
      <button id="reset">🔄 처음부터</button>
      <button id="sound">🔊 소리 ON</button>
      <button id="preview">🎧 재료 소리 듣기</button>
    </div>

    <p class="hint" id="hint">
      만들기 → 손으로 빚기 → 왁스 담그기 → 식히기 → 부수기
    </p>
  </section>
</main>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

const palette = [
  ["딸기","#ffc3d8"],
  ["라벤더","#cdbaf5"],
  ["민트","#b7e9d9"],
  ["레몬","#ffe8a9"],
  ["하늘","#b8ddf9"],
  ["복숭아","#ffd0b9"]
];

let core = "#ffc3d8";
let wax = "#cdbaf5";
let material = "클레이";
let stage = "ready";
let kneads = 0;
let dips = 0;
let hits = 0;
let need = 3;
let maxHits = 16;
let soundOn = true;
let ctx = null;
let token = 0;

function audioReady() {
  try {
    const AudioClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioClass) return;
    ctx = ctx || new AudioClass();
    if (ctx.state === "suspended") ctx.resume();
  } catch(e) {}
}

function crackSound(big = false) {
  if (!soundOn) return;
  audioReady();
  if (!ctx) return;

  const t = ctx.currentTime;
  const rate = ctx.sampleRate;
  const out = ctx.createGain();
  out.gain.value = 0.6;
  out.connect(ctx.destination);

  function grain(at,len,vol,low,high,texture="crisp") {
    const n = Math.ceil(rate * len);
    const buffer = ctx.createBuffer(1,n,rate);
    const data = buffer.getChannelData(0);
    let smooth = 0;

    for (let i=0;i<n;i++) {
      const x=i/n;
      const r=Math.random()*2-1;
      smooth=.94*smooth+.06*r;
      const envelope=texture==="rub"
        ? Math.sin(Math.PI*x)**2
        : Math.pow(1-x,texture==="crisp"?5:1.4)
          *(1-Math.exp(-x*100));
      data[i]=(texture==="rub"?smooth*3:r)*envelope;
    }

    const src=ctx.createBufferSource();
    src.buffer=buffer;
    const hp=ctx.createBiquadFilter();
    hp.type="highpass";
    hp.frequency.value=low;
    const lp=ctx.createBiquadFilter();
    lp.type="lowpass";
    lp.frequency.value=high;
    const gain=ctx.createGain();
    gain.gain.value=vol;

    src.connect(hp);
    hp.connect(lp);
    lp.connect(gain);
    gain.connect(out);
    src.start(t+at);
  }

  function chirp(at,len,start,end,vol) {
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(start,t+at);
    o.frequency.exponentialRampToValueAtTime(end,t+at+len);
    g.gain.setValueAtTime(.0001,t+at);
    g.gain.exponentialRampToValueAtTime(vol,t+at+.009);
    g.gain.exponentialRampToValueAtTime(.0001,t+at+len);
    o.connect(g);
    g.connect(out);
    o.start(t+at);
    o.stop(t+at+len+.01);
  }

  grain(0,.02,.24,3000,11000);

  if (material==="클레이") {
    for(let i=0;i<(big?25:13);i++) {
      grain(.014+i*.009,.02,.12,1800,6800);
    }
    for(let i=0;i<7;i++) {
      grain(.06+i*.025,.04,.07,850,3200,"crumb");
    }
  } else if(material==="스퀴시") {
    for(let i=0;i<5;i++) {
      grain(.015+i*.02,.015,.09,2600,9000);
    }
    grain(.07,big?.45:.3,.33,180,1900,"rub");
    grain(.16,.28,.2,380,2500,"rub");
    chirp(.075,.23,350,165,.05);
  } else {
    for(let i=0;i<12;i++) {
      grain(.015+i*.013,.012,.1,3400,10500);
    }
    for(let i=0;i<7;i++) {
      const d=.05+i*.045;
      chirp(d,.07,750,200,.045);
      grain(d,.04,.075,520,3000,"rub");
    }
    chirp(.1,.35,270,125,.05);
  }
}

function softSound() {
  if(!soundOn) return;
  audioReady();
  if(!ctx) return;

  const o=ctx.createOscillator();
  const g=ctx.createGain();
  const t=ctx.currentTime;
  o.type="sine";
  o.frequency.setValueAtTime(240,t);
  o.frequency.exponentialRampToValueAtTime(105,t+.13);
  g.gain.setValueAtTime(.075,t);
  g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(t);
  o.stop(t+.15);
}

function say(s) {
  $("status").textContent=s;
}

function progress(p) {
  $("fill").style.width=Math.min(100,p)+"%";
}

function setStage(s,label) {
  stage=s;
  $("phase").textContent=label;
}

function select(id,fn) {
  $(id).addEventListener("click",e=>{
    const b=e.target.closest("button");
    if(!b || stage!=="ready") return;
    $(id).querySelectorAll("button").forEach(x=>{
      x.classList.remove("active");
    });
    b.classList.add("active");
    fn(b.dataset.v);
    render();
  });
}

select("cores",v=>material=v);

for(const [id,initial,fn] of [
  ["colors",core,v=>core=v],
  ["waxes",wax,v=>wax=v]
]) {
  palette.forEach(([name,color])=>{
    const b=document.createElement("button");
    b.className="swatch"+(color===initial?" active":"");
    b.dataset.v=color;
    b.title=name;
    b.setAttribute("aria-label",name);
    b.style.background=color;
    $(id).appendChild(b);
  });
  select(id,fn);
}

$("thick").addEventListener("input",()=>{
  $("thickLabel").textContent=$("thick").value+"겹";
});

function render() {
  $("ball").style.setProperty("--core",core);
  $("ball").style.setProperty("--wax",wax);
  $("scene").style.setProperty("--wax",wax);

  let opacity=0;
  if(stage==="dip") opacity=dips/need;
  else if(["cool","cooling","break"].includes(stage)) opacity=1;
  else if(stage==="broken") opacity=0;

  $("coat").style.opacity=opacity;
  $("face").textContent=stage==="broken"?"•ᴗ•":"˶ᵔ ᵕ ᵔ˶";
}

function animate(cls) {
  const b=$("ball");
  b.classList.remove("press","dip");
  void b.offsetWidth;
  b.classList.add(cls);
}

function scatter(n,big=false) {
  const scene=$("scene");
  const ball=$("ball");
  const sceneRect=scene.getBoundingClientRect();
  const ballRect=ball.getBoundingClientRect();
  const centerX=ballRect.left-sceneRect.left+ballRect.width/2;
  const centerY=ballRect.top-sceneRect.top+ballRect.height/2;

  for(let i=0;i<n;i++) {
    const p=document.createElement("i");
    p.className="particle";
    const size=big?12+Math.random()*18:5+Math.random()*12;
    p.style.width=size+"px";
    p.style.height=(size*.8)+"px";
    p.style.left=(centerX+(Math.random()-.5)*110)+"px";
    p.style.top=(centerY+(Math.random()-.5)*110)+"px";
    p.style.setProperty("--x",(Math.random()*320-160)+"px");
    p.style.setProperty("--y",(Math.random()*240-130)+"px");
    p.style.setProperty("--r",(Math.random()*600-300)+"deg");
    scene.appendChild(p);
    setTimeout(()=>p.remove(),900);
  }
}

function makeCrack() {
  const svg=$("cracks");
  const ns="http://www.w3.org/2000/svg";
  const angle=hits*2.399;
  const radius=16+(hits%6)*17;
  const x=115+Math.cos(angle)*radius;
  const y=115+Math.sin(angle)*radius;

  const path=document.createElementNS(ns,"path");
  const points=[];
  for(let i=0;i<6;i++) {
    points.push([
      x+(i-2)*7+(Math.random()-.5)*10,
      y+(i-2)*5+(Math.random()-.5)*16
    ]);
  }
  path.setAttribute("d",points.map((p,i)=>
    (i===0?"M":"L")+" "+p[0]+" "+p[1]
  ).join(" "));
  svg.appendChild(path);
}

function makeHole() {
  const hole=document.createElement("div");
  hole.className="hole";
  const angle=hits*2.399;
  const radius=15+(hits%5)*16;
  const x=115+Math.cos(angle)*radius;
  const y=115+Math.sin(angle)*radius;
  const size=12+Math.random()*22;

  hole.style.left=x+"px";
  hole.style.top=y+"px";
  hole.style.width=size+"px";
  hole.style.height=(size*.85)+"px";
  $("holes").appendChild(hole);
}

function start() {
  token++;
  kneads=dips=hits=0;
  need=Number($("thick").value);
  maxHits=7+need*3;

  $("cracks").innerHTML="";
  $("holes").innerHTML="";
  $("bowl").classList.add("hidden");

  setStage("knead","STEP 2 · 손으로 동글동글 빚기");
  $("start").disabled=true;
  $("next").disabled=true;
  $("next").textContent="다음 단계";

  progress(0);
  say("공을 6번 눌러 동그랗게 빚어 줘! ✋");
  $("hint").textContent="볼을 클릭하거나 터치해 반죽해 봐";
  render();
  softSound();
}

function next() {
  if(stage==="knead" && kneads>=6) {
    setStage("dip","STEP 3 · 왁스에 담그기");
    $("bowl").classList.remove("hidden");
    dips=0;
    progress(0);
    $("next").disabled=true;
    say("볼을 눌러 왁스에 퐁당! "+need+"번 코팅해 줘 🫧");
    render();
  }
  else if(stage==="dip" && dips>=need) {
    setStage("cool","STEP 4 · 코팅 굳히기");
    $("bowl").classList.add("hidden");
    $("next").disabled=false;
    $("next").textContent="❄️ 식히기";
    progress(0);
    say("식히기 버튼을 눌러 왁스를 굳혀 줘!");
    render();
  }
  else if(stage==="cool") {
    setStage("cooling","❄️ 왁스 굳히는 중");
    $("next").disabled=true;
    const current=++token;
    let p=0;

    const timer=setInterval(()=>{
      if(token!==current) {
        clearInterval(timer);
        return;
      }
      p+=10;
      progress(p);
      if(p>=100) {
        clearInterval(timer);
        setStage("break","STEP 5 · 바사삭 부수기");
        $("next").textContent="다음 단계";
        say("완성! 이제 공을 눌러 왁스를 깨뜨려 봐! 💥");
        $("hint").textContent="여러 번 누르면 균열이 퍼지고 속재료가 드러나요.";
        render();
      }
    },150);
  }
}

function touchBall() {
  if(stage==="knead") {
    if(kneads>=6) return;
    kneads++;
    animate("press");
    softSound();
    progress(kneads/6*100);
    say(kneads<6
      ?"조물조물~ "+kneads+"/6번 빚었어 ☁️"
      :"동그랗게 완성! 다음 단계를 눌러 줘 🎀");
    if(kneads>=6) $("next").disabled=false;
    return;
  }

  if(stage==="dip") {
    if(dips>=need) return;
    dips++;
    animate("dip");
    softSound();
    progress(dips/need*100);
    say(dips<need
      ?"퐁당! "+dips+"/"+need+"겹 코팅했어 🫧"
      :"반짝반짝 코팅 완성! ✨");
    if(dips>=need) $("next").disabled=false;
    render();
    return;
  }

  if(stage!=="break") return;

  hits++;
  animate("press");
  crackSound(hits>=maxHits);

  makeCrack();
  if(hits>=3 && hits%2===1) makeHole();
  scatter(hits>=maxHits?35:5+Math.floor(hits/3),hits>=maxHits);

  progress(hits/maxHits*100);
  say([
    "빠직! 작은 금이 생겼어! 💥",
    "바사삭! 껍질이 갈라지고 있어 ✨",
    "와자작! 속재료가 보이기 시작해 🫧",
    "조금만 더! 거의 다 깨졌어 💗"
  ][hits%4]);

  if(hits>=maxHits) {
    setStage("broken","🎉 완파 성공!");
    $("cracks").innerHTML="";
    $("holes").innerHTML="";
    say("와아! 왁스 껍질을 모두 부쉈어! 속은 말랑말랑 💕");
    $("hint").textContent="처음부터 버튼으로 새로운 왁뿌볼을 만들어 봐.";
    render();
  }
}

function reset() {
  token++;
  setStage("ready","STEP 1 · 재료 준비");
  kneads=dips=hits=0;
  $("cracks").innerHTML="";
  $("holes").innerHTML="";
  $("bowl").classList.add("hidden");
  $("start").disabled=false;
  $("next").disabled=true;
  $("next").textContent="다음 단계";
  progress(0);
  say("새로운 왁뿌볼을 만들어 볼까? 💗");
  $("hint").textContent="만들기 → 손으로 빚기 → 왁스 담그기 → 식히기 → 부수기";
  render();
}

$("start").addEventListener("click",start);
$("next").addEventListener("click",next);
$("reset").addEventListener("click",reset);

$("sound").addEventListener("click",()=>{
  audioReady();
  soundOn=!soundOn;
  $("sound").textContent=soundOn?"🔊 소리 ON":"🔇 소리 OFF";
});

$("preview").addEventListener("click",()=>{
  audioReady();
  if(!soundOn) {
    soundOn=true;
    $("sound").textContent="🔊 소리 ON";
  }
  crackSound(false);
});

$("ball").addEventListener("pointerdown",touchBall);
$("ball").addEventListener("keydown",e=>{
  if(e.key==="Enter" || e.key===" ") {
    e.preventDefault();
    touchBall();
  }
});

render();
})();
</script>
</body>
</html>
